name: Validacion del juego

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v6

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Comprobar configuracion con Docker Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          call: check

      - name: Comprobar configuracion con Docker Bake
        uses: docker/bake-action@v7
        with:
          files: ./docker-bake.hcl
          targets: app
          call: check

      - name: Construir imagen y comprobar sintaxis
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: juego-validacion:latest

      - name: Ejecutar juego y mostrar salida
        run: docker run --rm juego-validacion:latest